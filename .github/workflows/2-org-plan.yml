# ------------------------------------------------------------------------------
# Organisation — Terraform Plan
#
# Triggers on every PR that touches files in 2-organisation/.
# Runs terraform plan and posts the output as a PR comment so the
# engineer can review exactly what will change before merging.
#
# Authentication: GitHub OIDC — no static AWS keys stored anywhere.
# The OIDC role is created by 2-organisation/github_oidc.tf.
# ------------------------------------------------------------------------------

name: Organisation Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - '2-organisation/**'

# Permissions required for OIDC token and PR comment
permissions:
  id-token: write   # allows GitHub to issue the OIDC JWT token
  contents: read    # allows checkout
  pull-requests: write  # allows posting plan output as PR comment

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    # Pass Terraform variables from GitHub repository variables.
    # TF_VAR_ prefix is automatically picked up by Terraform.
    env:
      TF_VAR_management_account_id: ${{ vars.MANAGEMENT_ACCOUNT_ID }}
      TF_VAR_github_org: ${{ vars.GH_ORG }}
      TF_VAR_sandbox_email: ${{ secrets.SANDBOX_EMAIL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Exchange GitHub OIDC token for temporary AWS credentials.
      # No secrets stored in GitHub — credentials expire after the job ends.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.MANAGEMENT_ACCOUNT_ID }}:role/github-actions-aws-org-infra
          aws-region: eu-west-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.6"

      - name: Terraform Init
        working-directory: 2-organisation
        run: terraform init

      - name: Terraform Validate
        working-directory: 2-organisation
        run: terraform validate

      # Save the plan to a file so we can display it in the PR comment.
      # -out saves the plan so apply uses exactly this plan (not a new one).
      - name: Terraform Plan
        id: plan
        working-directory: 2-organisation
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      # Post the plan output as a comment on the PR so reviewers can see
      # exactly what will be created, changed, or destroyed before merging.
      - name: Post plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('2-organisation/plan_output.txt', 'utf8');
            const maxLength = 65000;
            const truncated = plan.length > maxLength
              ? plan.substring(0, maxLength) + '\n\n... (truncated — see Actions log for full output)'
              : plan;

            const body = `## Terraform Plan — \`2-organisation/\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${truncated}
            \`\`\`

            </details>

            *Triggered by commit \`${{ github.sha }}\` on branch \`${{ github.head_ref }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Check plan exit code
        if: steps.plan.outputs.exit_code != '0'
        run: exit 1
